<!doctype html>
<!-- Renders one clip as a strip of stills, for showing the motion to a model that can't watch video.
     filmstrip.html?clip=<clip id>&frames=8 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filmstrip</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; background: #fff; }
  .strip { display: grid; grid-template-columns: repeat(var(--cols, 4), 400px); width: max-content; }
  .cell { position: relative; }
  .cell .stage-wrap { width: 400px; height: 225px; border-radius: 0; box-shadow: inset 0 0 0 1px #e6e5e0; }
  .cell .n { font: 600 13px -apple-system, sans-serif; color: #86868b; padding: 6px 10px 10px; }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<script src="clips.js"></script>
<script>
const q = new URLSearchParams(location.search);
const clip = CLIPS.find(c => c.id === q.get('clip')) ?? CLIPS[0];
const frames = +(q.get('frames') ?? 8);
const cols = +(q.get('cols') ?? 4);
strip.style.setProperty('--cols', cols);

// Sample the motion itself: the still lead-in and hold at the end carry no information.
const probe = new ClipPlayer(document.createElement('div'));
probe.load(clip);
const motion = probe.period - 400 - 900;   // LEAD_MS, HOLD_MS

for (let i = 0; i < frames; i++) {
  const phase = 400 + motion * (i / (frames - 1));
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<div class="stage-wrap"><div class="stage"></div></div><div class="n">${i + 1} · ${Math.round(phase - 400)} ms</div>`;
  strip.append(cell);
  const stage = cell.querySelector('.stage');
  fitStage(cell.querySelector('.stage-wrap'), stage);
  const p = new ClipPlayer(stage);
  p.load(clip);
  p.setPhase(phase);
}
document.title = `${clip.id} · ${Math.round(motion)} ms`;
</script>
</body>
</html>
